<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Для тебе ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #070510;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Кібер-сітка на фоні */
    .cyber-grid {
      position: fixed;
      inset: -50%;
      background-image: 
        linear-gradient(rgba(255, 0, 128, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.18) 1px, transparent 1px);
      background-size: 45px 45px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(45px); }
    }

    /* Неонові плями світла */
    .glow-orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { background: #ff007f; top: -80px; left: -60px; }
    .orb-2 { background: #00e5ff; bottom: -80px; right: -60px; }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Головна картка */
    .card {
      position: relative;
      z-index: 5;
      width: min(92vw, 440px);
      padding: 32px 24px 28px;
      border-radius: 28px;
      background: rgba(18, 14, 34, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 0 40px rgba(255, 0, 128, 0.25),
        inset 0 0 24px rgba(0, 229, 255, 0.1);
      text-align: center;
      transition: transform 0.15s ease;
    }

    .card.shake {
      animation: cardShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes cardShake {
      10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-0.5deg); }
      20%, 80% { transform: translate3d(3px, 0, 0) rotate(0.5deg); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .top-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 0, 128, 0.18);
      border: 1px solid rgba(255, 0, 128, 0.5);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ff66b2;
      margin-bottom: 18px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff2a85;
      box-shadow: 0 0 8px #ff2a85;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Пульсуюче неонове серце */
    .heart-wrap {
      margin: 6px auto 18px;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .neon-heart {
      font-size: 72px;
      line-height: 1;
      filter: drop-shadow(0 0 18px rgba(255, 0, 110, 0.85));
      animation: heartBeat 1.15s infinite ease-in-out;
      transition: transform 0.2s;
    }

    .heart-wrap:active .neon-heart {
      transform: scale(1.3);
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1.03); }
      42% { transform: scale(1.22); }
      70% { transform: scale(1); }
    }

    /* Головний заголовок */
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, #ff80bf, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 0, 128, 0.3);
    }

    .subtext {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* Динамічний бейдж компліментів */
    .vibe-badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 0, 128, 0.28), rgba(0, 229, 255, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    /* Кнопка бусту */
    .boost-btn {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff);
      background-size: 200% auto;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 0, 127, 0.55);
      animation: gradientFlow 3s linear infinite;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .boost-btn:hover {
      box-shadow: 0 0 34px rgba(0, 210, 255, 0.75);
    }

    .boost-btn:active {
      transform: scale(0.96);
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Міні-еквалайзер знизу */
    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 18px;
      margin-top: 20px;
      opacity: 0.7;
    }

    .bar {
      width: 4px;
      background: linear-gradient(to top, #ff007f, #00e5ff);
      border-radius: 4px;
      animation: eq 0.8s ease-in-out infinite alternate;
    }

    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.1s; }
    .bar:nth-child(5) { animation-delay: 0.5s; }
    .bar:nth-child(6) { animation-delay: 0.3s; }
    .bar:nth-child(7) { animation-delay: 0.15s; }

    @keyframes eq {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    /* Спливаючі стікери при кліку */
    .floating-sticker {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(15, 12, 30, 0.9);
      border: 1.5px solid #ff2a85;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 0 18px rgba(255, 42, 133, 0.6);
      animation: stickerFly 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stickerFly {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.5) rotate(-8deg);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -25px) scale(1.08) rotate(4deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -130px) scale(0.95) rotate(-4deg);
      }
    }
  </style>
</head>
<body>

  <div class="cyber-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <canvas id="fxCanvas"></canvas>

  <div class="card" id="mainCard">
    <div class="top-tag">
      <span class="dot"></span>
      <span>100% MY CRUSH • FOREVER</span>
    </div>

    <div class="heart-wrap" id="heartBtn">
      <div class="neon-heart">❤️</div>
    </div>

    <h1>Ти моя кохана ❤️<br>Я тебе кохаю</h1>
    <p class="subtext">Ти найкраще, що є в моєму житті ✨</p>

    <div class="vibe-badge" id="vibeBadge">ТИ ПРОСТО НЕЙМОВІРНА 🔥</div>

    <button class="boost-btn" id="boostBtn">НАТИСНИ ДЛЯ БУСТУ ⚡</button>

    <div class="equalizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('mainCard');
    const boostBtn = document.getElementById('boostBtn');
    const heartBtn = document.getElementById('heartBtn');
    const vibeBadge = document.getElementById('vibeBadge');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const compliments = [
      "ТИ ПРОСТО НЕЙМОВІРНА 🔥",
      "100/10 ІМБА ⚡",
      "ТИ ПРОСТО КОСМОС 🚀",
      "МІЙ КРАШ НАЗАВЖДИ 💘",
      "НАЙКРАЩА У СВІТІ 👑",
      "ЛЮБЛЮ БЕЗМЕЖНО ❤️‍🔥",
      "ТИ МІЙ ВАЙБ ✨"
    ];

    let compIndex = 0;
    setInterval(() => {
      compIndex = (compIndex + 1) % compliments.length;
      vibeBadge.style.opacity = '0';
      vibeBadge.style.transform = 'scale(0.9)';
      setTimeout(() => {
        vibeBadge.textContent = compliments[compIndex];
        vibeBadge.style.opacity = '1';
        vibeBadge.style.transform = 'scale(1)';
      }, 220);
    }, 2600);

    // Частинки сердечок та іскор
    const particles = [];
    const emojis = ['❤️', '💖', '🔥', '✨', '💘', '⚡'];

    class Particle {
      constructor(x, y, burst = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = burst ? (Math.random() * 7 + 3) : (Math.random() * 2 + 0.6);
        this.vx = Math.cos(angle) * speed;
        this.vy = burst ? Math.sin(angle) * speed - 2 : -(Math.random() * 1.8 + 0.6);
        this.size = burst ? (Math.random() * 16 + 14) : (Math.random() * 12 + 10);
        this.alpha = 1;
        this.decay = burst ? (Math.random() * 0.02 + 0.015) : (Math.random() * 0.008 + 0.004);
        this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
        this.rotation = (Math.random() - 0.5) * 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.emoji, this.x, this.y);
        ctx.restore();
      }
    }

    // Фонові сердечка
    setInterval(() => {
      if (particles.length < 75) {
        particles.push(new Particle(Math.random() * width, height + 20, false));
      }
    }, 280);

    function spawnBurst(x, y, count = 24) {
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    function spawnSticker(x, y) {
      const sticker = document.createElement('div');
      sticker.className = 'floating-sticker';
      sticker.textContent = compliments[Math.floor(Math.random() * compliments.length)];
      sticker.style.left = `${x}px`;
      sticker.style.top = `${y}px`;
      document.body.appendChild(sticker);
      setTimeout(() => sticker.remove(), 1500);
    }

    function triggerHype(x, y) {
      spawnBurst(x, y, 30);
      spawnSticker(x, y - 20);
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    boostBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = boostBtn.getBoundingClientRect();
      triggerHype(rect.left + rect.width / 2, rect.top);
    });

    heartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = heartBtn.getBoundingClientRect();
      triggerHype(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('.heart-wrap')) return;
      spawnBurst(e.clientX, e.clientY, 14);
      spawnSticker(e.clientX, e.clientY);
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
